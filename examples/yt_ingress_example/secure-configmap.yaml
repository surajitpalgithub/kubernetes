apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ssl-config

data:
  default.conf: |
    server {
        listen 8443 ssl;

        server_name app.host.com;

        ssl_certificate /etc/nginx/tls/tls.crt;
        ssl_certificate_key /etc/nginx/tls/tls.key;

        root /usr/share/nginx/html;
        index index.html;
    }