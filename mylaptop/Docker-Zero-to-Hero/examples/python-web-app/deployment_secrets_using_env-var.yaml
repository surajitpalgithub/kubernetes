apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-python-app
  labels:
    app: sample-python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-python-app
  template:
    metadata:
      labels:
        app: sample-python-app
    spec:
      containers:
        - name: python-app
          image: surajitpaldocker/python-sample-app-demo:v1
          ports:
            - containerPort: 8000
          # Inject secrets as environment variables
          env:
              - name: DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: app-env-var-secrets
                    key: db-port
              - name: DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: app-env-var-secrets
                    key: db-password